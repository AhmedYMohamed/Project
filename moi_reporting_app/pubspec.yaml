name: moi_reporting_app
description: A new Flutter project for MoI Reporting System.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.3.3
  file_picker: ^11.0.2
  path_provider: ^2.1.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  geolocator: ^14.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geocoding: ^5.0.0
  record: ^7.1.1
  permission_handler: ^12.0.3
  http: ^1.1.0
  url_launcher: ^6.3.2
  video_player: ^2.10.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
