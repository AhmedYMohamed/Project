

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_MODEL=qwen2.5:7b
      - OLLAMA_TIMEOUT=15
      - ENVIRONMENT=development
      - DEBUG=True
      - LOCAL_STORAGE_PATH=/app/attachments
      - SQLALCHEMY_DATABASE_URI_OPS=Server=mssql,1433;Database=moi-ops;Uid=sa;Pwd=YourStrong!Passw0rd;Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=30;
      - SQLALCHEMY_DATABASE_URI_ANALYTICS=Server=mssql,1433;Database=moi-al;Uid=sa;Pwd=YourStrong!Passw0rd;Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=30;
    volumes:
      - ./app:/app/app
      - ./attachments:/app/attachments
      - ./RAG_pipeline:/app/RAG_pipeline
    depends_on:
      - db-init
      - ollama
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:7b && tail -f /dev/null"]
    restart: unless-stopped
      
  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - mssql
    volumes:
      - ./database/shema.sql:/shema.sql
      - ./init.sh:/init.sh
    command: bash /init.sh

volumes:
  mssql-data:
  ollama_storage:
