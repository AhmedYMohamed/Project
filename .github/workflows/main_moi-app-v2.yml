# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - moi-app-v2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ⚡ Cache python dependencies based on requirements.txt hash
      - name: Cache Pip packages
        uses: actions/cache@v4
        with:
          path: .python_packages
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Install packages into target directory only if requirements changed
      - name: Install dependencies
        run: |
          pip install --target=".python_packages/lib/site-packages" --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      # Upload the pre-built packages directly
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !moi_reporting_app/
            !moi-df/
            !MOI-data-factory/
            !dataset/
            !.git/
            !.github/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BC985D078C954B5D95E57100039073A0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_83B59607D8AF4CC7991CD7352B410E13 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BC4E6F83ED45476CB00F66CCA0C675BD }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'moi-app-v2'
          slot-name: 'Production'
          
      # Explicitly tell App Service where the pre-built dependencies live and
      # confirm Oryx build is skipped, since we already install packages above.
      - name: Configure app settings for pre-built package (no Oryx build)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name moi-app-v2 \
              --resource-group rg-moi-reporting-prod \
              --settings \
                SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                PYTHONPATH="/home/site/wwwroot/.python_packages/lib/site-packages" \
                AZURE_KEY_VAULT_NAME="moi-reporting-kv" \
                AZURE_CLIENT_ID="af1e897b-5776-4fee-8607-3d86ba2f9152" \
                OLLAMA_URL="https://ollama-service.grayocean-bf77a031.uaenorth.azurecontainerapps.io/api/generate" \
                OLLAMA_MODEL="llama3.1" \
                OLLAMA_TIMEOUT="30"

      # Force a real restart so the worker process reloads the new files
      - name: Restart Azure Web App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp restart \
              --name moi-app-v2 \
              --resource-group rg-moi-reporting-prod
